name: Sync & Build APK

# 一键：同步上游 → 保留本地修改(rebase) → 构建 APK → 上传 artifact / 发布 Release
# 使用：Actions 页 → Sync & Build APK → Run workflow（分支选项随意，本工作流固定构建 feat/later-status-setting）
#       tag 输入框：填写如 v5177 则同时发布 Release（手机浏览器可直接下载安装）；留空则仅上传 artifact
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 Release 的版本号（如 v5177），留空则仅上传 artifact"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 代码迁出（完整历史）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feat/later-status-setting

      - name: 同步上游并保留本地修改
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add upstream https://github.com/bggRGjQaUbCoE/PiliPlus.git
          git fetch upstream main
          if ! git rebase upstream/main; then
            echo "::error::rebase 冲突：上游改动与本地修改重叠，需要本地解决后重试"
            echo "::error::  1) git checkout feat/later-status-setting"
            echo "::error::  2) git fetch origin && git rebase origin/main"
            echo "::error::  3) 解决冲突: git status → 编辑 → git add → git rebase --continue"
            echo "::error::  4) git push -f fork feat/later-status-setting"
            echo "::error::  5) 重新运行本 workflow"
            exit 1
          fi
          git push origin HEAD:feat/later-status-setting --force

      - name: 构建 Java 环境
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Write key（签名密钥，来自 fork Secrets）
        run: |
          if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
            echo storeFile='key.jks' >> android/key.properties
            echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
            echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties
          fi

      - name: 构建 Release APK（versionCode = 提交数）
        run: flutter build apk --release --split-per-abi --build-number=$(git rev-list --count HEAD) --pub

      - name: 重命名 APK
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's|app-(.*)-release\.apk|\1|')
            mv "$f" "PiliPlus_${abi}.apk"
          done
        shell: bash

      - name: 发布 Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: build/app/outputs/flutter-apk/PiliPlus_*.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus_apk
          path: build/app/outputs/flutter-apk/PiliPlus_*.apk
          if-no-files-found: error
